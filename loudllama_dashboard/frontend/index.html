<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoudLlama Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd166'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23ff9d4d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/gridstack/gridstack.min.css" />
  <!--
    gridstack-extra.min.css provides the item-width CSS rules for grid
    instances that don't use the default 12 columns (e.g. the Room widget's
    nested sub-widget grid, which uses 4). Without it, GridStack has no CSS
    to size items in a non-12-column grid and every item renders at 0 width.
    See https://github.com/gridstack/gridstack.js#change-grid-columns
  -->
  <link rel="stylesheet" href="vendor/gridstack/gridstack-extra.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/store.css" />
  <!--
    Widget CSS/JS is no longer listed here: only the widgets a person has
    actually added via the widget store get loaded, and store.js injects
    those <link>/<script> tags on demand (see js/widget-catalog.js + app.js
    loadInstalledWidgets()). This keeps a fresh dashboard from pulling in
    every widget that ships with the add-on, whether it's used or not.
  -->
</head>
<body>
  <div id="llw-background"></div>

  <header id="llw-toolbar">
    <div class="llw-toolbar__brand">LoudLlama Dashboard</div>
    <div class="llw-toolbar__actions">
      <label class="llw-bg-upload" id="llw-bg-label-wrap">
        <span id="llw-bg-label">Background</span>
        <input type="file" id="llw-bg-file" accept="image/*" />
      </label>
      <div class="llw-add-widget-wrap">
        <button id="llw-add-widget" type="button">+ Add widget</button>
        <div id="llw-add-widget-menu" class="llw-menu"></div>
      </div>
      <button id="llw-store-open" type="button">🧩 Widgets</button>
      <button id="llw-edit-toggle" type="button">Edit</button>
    </div>
  </header>

  <main id="llw-loading">Loading…</main>

  <!--
    Swipeable dashboard "pages", iOS home-screen style. Each page is its own
    independent GridStack instance (a plain 12-col grid, added on demand by
    app.js - there's no fixed page count in the markup here); #llw-pages-track
    holds them side by side and app.js slides it horizontally to switch pages,
    either by dragging/swiping or by tapping a dot below.
  -->
  <div id="llw-pages-viewport">
    <div id="llw-pages-track"></div>
  </div>

  <!--
    Page indicator dots - hidden entirely (via body.llw-multi-page, toggled
    in app.js) as long as there's only one page, same as iOS hides its own
    dots for a single home screen.
  -->
  <div id="llw-page-dots"></div>

  <!--
    Fixed row of pinned "favorite" widgets, iOS-dock style - stays put at
    the bottom of the screen regardless of which page is showing or how far
    it's scrolled. Empty (and hidden) until something is pinned; see app.js's
    pinToDock/unpinFromDock.
  -->
  <div id="llw-dock" class="llw-dock"></div>

  <script src="vendor/gridstack/gridstack-all.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/device.js"></script>
  <script src="js/widget-catalog.js"></script>
  <script src="js/app.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
